[package]
description = "GameCult deployment admission and daemon-survival authority"
name = "idunn"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "idunn"
path = "src/main.rs"

[[bin]]
name = "idunn-provision"
path = "src/bin/idunn-provision.rs"

[[bin]]
name = "idunn-host"
path = "src/bin/idunn-host.rs"

[lib]
name = "idunn_daemon"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
cultmesh-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "c13b6ba07e99f2535b455da74d07d88c308731f5", package = "cultmesh-rs" }
cultcache-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "c13b6ba07e99f2535b455da74d07d88c308731f5", package = "cultcache-rs" }
cultnet-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "c13b6ba07e99f2535b455da74d07d88c308731f5", package = "cultnet-rs" }
rmp-serde = "1.3"
sha2 = "0.10"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
ed25519-dalek = "2.2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
] }
