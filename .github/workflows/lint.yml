name: lint

on:
  push:
  pull_request:

jobs:
  clippy:
    # R-I23 (Self's ruling, Cut 1's eighth fix batch, F1): this repo had no
    # CI surface at all before this batch, so "denied in CI" had nowhere to
    # attach. This is that surface: `clippy.toml`'s `disallowed-methods`
    # list only stops a bypass of the frozen-symlink resolver's
    # `FrozenSymlinkFs` port (see `src/drivers.rs`, `frozen_symlink_port`)
    # if something actually runs clippy with the lint promoted to an error.
    #
    # No `--all-targets`: measured on Yggdrasil against this batch and
    # against a46b997 (its parent, before this batch touched anything) --
    # `cargo clippy --all-targets` already fails on a pre-existing,
    # unrelated `clippy::never_loop` in `host_actuator.rs`'s own test code,
    # nothing this batch introduced or is chartered to fix. Without
    # `--all-targets`, clippy still analyzes the library crate itself,
    # which is where `frozen_symlink_port` and every other disallowed-method
    # call site actually live, so the port's coverage is unaffected; only
    # test-only code outside the lib is left unchecked by this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-features -- -D clippy::disallowed_methods
